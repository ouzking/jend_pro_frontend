# Vérifications à chaque push / pull request : formatage, analyse statique,
# tests unitaires et d'écrans. Les tests d'intégration (tag `integration`)
# exigent le Supabase local du backend : ils se lancent en local (voir README).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse statique
        run: flutter analyze

      - name: Tests unitaires et d'écrans
        run: flutter test --exclude-tags integration --coverage

      - name: Couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
